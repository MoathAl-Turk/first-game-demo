<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Treasure Dash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-menu">
        <button onclick="setTheme('default')">Default</button>
        <button onclick="setTheme('purpleGreen')">Purple & Green</button>
        <button id="bwButton" onclick="setTheme('blackWhite')" disabled>🔒 Black & White (Beat Lvl 3)</button>
    </div>

    <h2>Click the game box, then use WASD or Arrows!</h2>
    <h3 id="levelText">Level 1</h3>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- NEW: Mobile D-Pad -->
    <div id="d-pad">
        <button id="btn-up" class="d-btn">▲</button>
        <button id="btn-left" class="d-btn">◄</button>
        <button id="btn-right" class="d-btn">►</button>
        <button id="btn-down" class="d-btn">▼</button>
    </div>

    <button id="respawnBtn" onclick="location.reload()">Respawn</button>

    <script src="game.js"></script>
</body>
</html>
